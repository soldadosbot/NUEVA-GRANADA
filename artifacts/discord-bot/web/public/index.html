<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>🏙️ RP Premium — Dashboard</title>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
</head>
<body>
  <div class="sidebar">
    <div class="sidebar-logo">
      <div class="logo-icon">🏙️</div>
      <div class="logo-text">
        <span class="logo-title">RP PREMIUM</span>
        <span class="logo-sub">Dashboard Admin</span>
      </div>
    </div>
    <nav class="sidebar-nav">
      <a href="#" class="nav-item active" data-page="dashboard">
        <span class="nav-icon">📊</span><span>Dashboard</span>
      </a>
      <a href="#" class="nav-item" data-page="usuarios">
        <span class="nav-icon">👥</span><span>Usuarios</span>
      </a>
      <a href="#" class="nav-item" data-page="banco">
        <span class="nav-icon">🏦</span><span>Banco</span>
      </a>
      <a href="#" class="nav-item" data-page="vehiculos">
        <span class="nav-icon">🚗</span><span>Vehículos</span>
      </a>
      <a href="#" class="nav-item" data-page="licencias">
        <span class="nav-icon">🚘</span><span>Licencias</span>
      </a>
      <a href="#" class="nav-item" data-page="logs">
        <span class="nav-icon">📋</span><span>Logs</span>
      </a>
    </nav>
    <div class="sidebar-footer">
      <div class="server-status" id="serverStatusBadge">
        <span class="status-dot"></span>
        <span id="serverStatusText">Cargando...</span>
      </div>
    </div>
  </div>

  <main class="main-content">
    <header class="topbar">
      <div class="topbar-left">
        <h1 id="pageTitle">Dashboard</h1>
        <span id="pageSub">Resumen general del servidor</span>
      </div>
      <div class="topbar-right">
        <div class="topbar-time" id="topbarTime"></div>
        <button class="btn-refresh" onclick="loadCurrentPage()">🔄 Actualizar</button>
      </div>
    </header>

    <div id="pageContent" class="page-content"></div>
  </main>

  <script src="js/app.js"></script>
</body>
</html>
